name: Build Coolapk Update Blocker APK
on:
  workflow_dispatch:
  push:
    branches: [coolapk-update-blocker-alpha]
    paths:
      - 'coolapk-update-blocker/**'
      - '.github/workflows/coolapk-update-blocker.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build release APK
        run: gradle -p coolapk-update-blocker assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CoolapkUpdateBlocker-alpha-${{ github.run_number }}
          path: coolapk-update-blocker/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
