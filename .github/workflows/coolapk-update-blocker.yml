name: Build Coolapk Update Blocker APK
on:
  workflow_dispatch:
  push:
    branches: [coolapk-update-blocker-alpha]
    paths:
      - 'coolapk-update-blocker/**'
      - '.github/workflows/coolapk-update-blocker.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed debug APK
        run: gradle -p coolapk-update-blocker assembleDebug --stacktrace
      - name: Verify and name signed APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="coolapk-update-blocker/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE_APK"
          APK="coolapk-update-blocker/app/build/outputs/apk/debug/CoolapkUpdateBlocker-alpha-${GITHUB_RUN_NUMBER}.apk"
          cp "$SOURCE_APK" "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CoolapkUpdateBlocker-signed-alpha-${{ github.run_number }}
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct signed APK download
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.verify.outputs.apk_path }}
        run: |
          TAG="coolapk-update-blocker-signed-alpha-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_PATH" \\
            --title "Coolapk Update Blocker signed alpha build ${GITHUB_RUN_NUMBER}" \\
            --notes "Signed debug APK. Verified with apksigner, unzip and aapt. Built from commit ${GITHUB_SHA}."
